name: Publish PEMESA scroll animation from repository video

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/animation-source.mp4'
      - '.github/workflows/build-film-frames.yml'

permissions:
  contents: write

concurrency:
  group: pemesa-film-frames
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify uploaded cinematic source
        run: |
          test -s assets/animation-source.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 assets/animation-source.mp4
      - name: Extract all 180 WebP frames
        run: |
          mkdir -p frames-film
          ffmpeg -y -hide_banner -loglevel error \
            -i assets/animation-source.mp4 \
            -vf 'fps=23,scale=1280:720:flags=lanczos' \
            -frames:v 180 -an -c:v libwebp -q:v 78 -compression_level 2 \
            frames-film/frame_%04d.webp
          test "$(find frames-film -maxdepth 1 -name 'frame_*.webp' | wc -l)" -eq 180
      - name: Publish frames on main
        run: |
          git config user.name 'PEMESA Frames Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frames-film/frame_*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish 180 video-derived frames for PEMESA homepage'
          git pull --rebase origin main
          git push origin HEAD:main
