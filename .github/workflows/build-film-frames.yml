name: Prepare PEMESA scroll video
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/animation-source.mp4'
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the published video matches the source
        id: source
        run: |
          version=$(sha256sum assets/animation-source.mp4 | cut -c1-8)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! grep -Fq "assets/home-scroll.mp4?v=$version" index.html; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Encode scroll video and poster
        if: steps.source.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          ffmpeg -y -i assets/animation-source.mp4 -vf fps=23 -an -c:v libx264 -preset slow -crf 25 -g 8 -keyint_min 8 -bf 0 -pix_fmt yuv420p -movflags +faststart assets/home-scroll.mp4
          ffmpeg -y -i assets/animation-source.mp4 -frames:v 1 -c:v libwebp -quality 84 assets/home-poster.webp
          sed -i -E "s@(assets/home-(scroll.mp4|poster.webp)\?v=)[a-f0-9]+@\1$VERSION@g" index.html
          git config user.name 'PEMESA Video Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/home-scroll.mp4 assets/home-poster.webp
          git commit -m 'Refresh the PEMESA scroll video and poster'
          git push origin HEAD:main
