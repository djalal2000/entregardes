name: Publish PEMESA scroll animation from video

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_film_frames.py'
      - '.github/workflows/build-film-frames.yml'

permissions:
  contents: write

concurrency:
  group: pemesa-film-frames
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless yt-dlp
      - name: Download original reference clip
        shell: bash
        run: |
          yt-dlp --no-playlist --socket-timeout 15 --retries 3 --merge-output-format mp4 \
            -f 'b[ext=mp4]/b' -o 'source.%(ext)s' \
            'https://www.youtube.com/shorts/gVxN-F22N6o'
          find . -maxdepth 1 -type f -name 'source.*' -print
      - name: Render 180 authentic motion frames
        shell: bash
        run: |
          VIDEO="$(find . -maxdepth 1 -type f -name 'source.*' | head -n 1)"
          test -s "$VIDEO"
          python scripts/build_film_frames.py --input "$VIDEO" --output frames-film
          test "$(find frames-film -maxdepth 1 -name 'frame_*.webp' | wc -l)" -eq 180
      - name: Commit the animated sequence
        shell: bash
        run: |
          git config user.name 'PEMESA Frames Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frames-film/frame_*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish 180 motion frames for PEMESA homepage'
          git pull --rebase origin main
          git push origin HEAD:main
